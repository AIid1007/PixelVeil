name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Download on-device models (bundled into the APK)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/selfie_multiclass_256x256.tflite \
            https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite
          curl -fsSL -o app/src/main/assets/blaze_face_short_range.tflite \
            https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite
          ls -la app/src/main/assets

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Check the APK has no internet permission
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          $AAPT dump permissions "$APK" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "INTERNET permission found"; exit 1; fi
          cp "$APK" PixelVeil.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PixelVeil-apk
          path: PixelVeil.apk

      - name: Publish to the 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PixelVeil latest build
          prerelease: true
          make_latest: true
          body: |
            Build of ${{ github.sha }}.
            Download PixelVeil.apk on your Android phone and open it to install.
          files: PixelVeil.apk

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log
          name: CI log (last failed build)
          prerelease: true
          make_latest: false
          body: Log of the last failed build (${{ github.sha }}).
          files: build.log

  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download on-device models
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/selfie_multiclass_256x256.tflite \
            https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite
          curl -fsSL -o app/src/main/assets/blaze_face_short_range.tflite \
            https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite

      - name: Build test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run analysis + export on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c || true
            ./gradlew --no-daemon connectedDebugAndroidTest > test.log 2>&1; echo $? > test_exit.txt
            adb logcat -d > logcat.txt || true

      - name: Publish test logs
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-log
          name: Emulator test logs (last run)
          prerelease: true
          make_latest: false
          body: Emulator test logs for ${{ github.sha }}.
          files: |
            test.log
            logcat.txt
            test_exit.txt

      - name: Fail if tests failed
        run: test "$(cat test_exit.txt)" = "0"
